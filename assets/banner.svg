<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#05070e" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="40%" stop-color="#a78bfa" />
      <stop offset="80%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.8" />
    </linearGradient>

    <!-- Node Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.6"/>
      <circle cx="40" cy="40" r="1" fill="#3b82f6" fill-opacity="0.3"/>
    </pattern>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { r: 5px; opacity: 0.6; }
      50% { r: 9px; opacity: 1; }
    }
    @keyframes floatAgent {
      0% { transform: translateY(0px) translateX(0px); }
      33% { transform: translateY(-8px) translateX(6px); }
      66% { transform: translateY(6px) translateX(-5px); }
      100% { transform: translateY(0px) translateX(0px); }
    }
    @keyframes dashMove {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -80; }
    }
    @keyframes orbitRotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes pillFloat1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }
    @keyframes pillFloat2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(6px); }
    }
    .node-orbit {
      transform-origin: 1040px 140px;
      animation: orbitRotate 22s linear infinite;
    }
    .agent-pulse1 { animation: pulseOrb 3.5s ease-in-out infinite; }
    .agent-pulse2 { animation: pulseOrb 4.2s ease-in-out infinite 1.2s; }
    .agent-pulse3 { animation: pulseOrb 2.8s ease-in-out infinite 0.7s; }
    .line-flow {
      stroke-dasharray: 6 6;
      animation: dashMove 4s linear infinite;
    }
    .card-float1 { animation: pillFloat1 5s ease-in-out infinite; }
    .card-float2 { animation: pillFloat2 6s ease-in-out infinite 1s; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />
  <rect width="1200" height="420" fill="url(#grid)" />

  <!-- Ambient Glow Orbs in Background -->
  <circle cx="150" cy="100" r="160" fill="#3b82f6" opacity="0.12" filter="url(#softGlow)" />
  <circle cx="1060" cy="180" r="180" fill="#8b5cf6" opacity="0.15" filter="url(#softGlow)" />
  <circle cx="650" cy="380" r="140" fill="#ec4899" opacity="0.10" filter="url(#softGlow)" />

  <!-- Network Graph Simulation Elements (Background/Right Canvas) -->
  <g opacity="0.75">
    <!-- Connecting Edges with subtle flow -->
    <line x1="880" y1="90" x2="1040" y2="140" stroke="#6366f1" stroke-width="2" opacity="0.7" class="line-flow" />
    <line x1="1040" y1="140" x2="1130" y2="240" stroke="#a855f7" stroke-width="1.8" opacity="0.6" />
    <line x1="1040" y1="140" x2="980" y2="290" stroke="#3b82f6" stroke-width="1.8" opacity="0.6" class="line-flow" />
    <line x1="880" y1="90" x2="980" y2="290" stroke="#38bdf8" stroke-width="1.2" opacity="0.4" />
    <line x1="980" y1="290" x2="1110" y2="350" stroke="#ec4899" stroke-width="1.5" opacity="0.5" />
    <line x1="1130" y1="240" x2="1110" y2="350" stroke="#8b5cf6" stroke-width="1.5" opacity="0.5" class="line-flow" />
    <line x1="770" y1="180" x2="880" y2="90" stroke="#3b82f6" stroke-width="1.5" opacity="0.5" />
    <line x1="770" y1="180" x2="980" y2="290" stroke="#60a5fa" stroke-width="1.2" opacity="0.4" />

    <!-- Autonomous Orbiting Ring -->
    <g class="node-orbit">
      <circle cx="1040" cy="140" r="75" fill="none" stroke="#60a5fa" stroke-width="1" stroke-dasharray="4 8" opacity="0.4" />
      <circle cx="1115" cy="140" r="4" fill="#38bdf8" filter="url(#glow)" />
      <circle cx="965" cy="140" r="3" fill="#f43f5e" filter="url(#glow)" />
    </g>

    <!-- Agent Simulation Nodes with Pulses -->
    <g transform="translate(880, 90)">
      <circle cx="0" cy="0" r="16" fill="#1e1b4b" stroke="#818cf8" stroke-width="2" />
      <circle cx="0" cy="0" r="6" fill="#a5b4fc" class="agent-pulse1" filter="url(#glow)" />
    </g>

    <g transform="translate(1040, 140)">
      <circle cx="0" cy="0" r="24" fill="#1e1b4b" stroke="#a855f7" stroke-width="2.5" />
      <circle cx="0" cy="0" r="9" fill="#c084fc" class="agent-pulse2" filter="url(#glow)" />
    </g>

    <g transform="translate(1130, 240)">
      <circle cx="0" cy="0" r="15" fill="#18181b" stroke="#ec4899" stroke-width="2" />
      <circle cx="0" cy="0" r="5" fill="#f472b6" class="agent-pulse3" filter="url(#glow)" />
    </g>

    <g transform="translate(980, 290)">
      <circle cx="0" cy="0" r="18" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
      <circle cx="0" cy="0" r="7" fill="#67e8f9" class="agent-pulse1" filter="url(#glow)" />
    </g>

    <g transform="translate(1110, 350)">
      <circle cx="0" cy="0" r="14" fill="#18181b" stroke="#a78bfa" stroke-width="1.8" />
      <circle cx="0" cy="0" r="5" fill="#c4b5fd" class="agent-pulse2" />
    </g>

    <g transform="translate(770, 180)">
      <circle cx="0" cy="0" r="13" fill="#0f172a" stroke="#60a5fa" stroke-width="1.6" />
      <circle cx="0" cy="0" r="4.5" fill="#93c5fd" class="agent-pulse3" />
    </g>
  </g>

  <!-- Left Dynamic Floating Feature Badges (Positioned cleanly outside main title) -->
  <g class="card-float1" transform="translate(80, 48)">
    <rect width="210" height="34" rx="17" fill="#1e293b" fill-opacity="0.85" stroke="#3b82f6" stroke-width="1.2"/>
    <circle cx="20" cy="17" r="5" fill="#10b981" />
    <text x="36" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#93c5fd">🤖 Multi-Agent Systems</text>
  </g>

  <g class="card-float2" transform="translate(305, 48)">
    <rect width="215" height="34" rx="17" fill="#1e293b" fill-opacity="0.85" stroke="#8b5cf6" stroke-width="1.2"/>
    <circle cx="20" cy="17" r="5" fill="#8b5cf6" />
    <text x="36" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#c4b5fd">🌐 Social Dynamics &amp; ABM</text>
  </g>

  <!-- Foreground Title and Core Branding -->
  <g transform="translate(80, 155)">
    <!-- Main Title -->
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="url(#titleGrad)" letter-spacing="-0.5px">
      Multi-Agent Simulation &amp; Social Dynamics
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="#cbd5e1" opacity="0.95">
      The Curated Universe of ABMs, Generative Agent Societies &amp; Complex Systems
    </text>

    <!-- Ecosystem Pill Highlights -->
    <g transform="translate(0, 84)">
      <!-- Pill 1 -->
      <g>
        <rect x="0" y="0" width="165" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
        <text x="14" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#38bdf8">👥 Generative Societies</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(177, 0)">
        <rect x="0" y="0" width="160" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
        <text x="14" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#a78bfa">⚡ System Dynamics</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(349, 0)">
        <rect x="0" y="0" width="155" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
        <text x="14" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#f472b6">🕸️ Network Contagion</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(516, 0)">
        <rect x="0" y="0" width="155" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
        <text x="14" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#34d399">🔬 Emergent Behavior</text>
      </g>
    </g>

    <!-- Bottom Metadata Description -->
    <text x="0" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#94a3b8">
      Open-Source Frameworks • Enterprise Digital Twins • LLM Sandboxes • Computational Social Science
    </text>
  </g>

  <!-- Border Frame Accent Line -->
  <rect x="0" y="415" width="1200" height="5" fill="url(#titleGrad)" />
</svg>
